
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="container">
    <section class="box">

      <header class="heading">
        <span class="tag">Counter App</span>
        <p>Count it. Save it. Load it.</p>
      </header>

      <div class="help-link">
        <a href="./help.html" class="help-btn">
          <span>ⓘ</span> Help &amp; Guide
        </a>
      </div>

      <!-- First Counter -->
      <div class="screen-box">
        <p class="screen-label">CURRENT COUNT</p>
        <div id="count" class="screen">0</div>
        <p>Counts from 0 to 107</p>
      </div>

      <!-- Second Counter -->
      <div class="screen-box">
        <p class="screen-label">COMPLETED SETS</p>
        <div id="count2" class="screen">0</div>
        <p>+1 for every 108 counts</p>
      </div>

      <!-- Counter Controls -->
      <div class="controls">
        <button type="button" class="btn increment" onclick="increment()">
          Increment (+)
        </button>

        <button type="button" class="btn decrement" onclick="Decrement()">
          Decrement (-)
        </button>
      </div>

      <!-- Utility Buttons -->
      <div class="utility-box">
        <button type="button" class="btn reset" onclick="Reset()">
          Reset
        </button>

        <button type="button" class="btn save" onclick="Save()">
          Save
        </button>

        <button type="button" class="btn load" onclick="Load_from_save()">
          Load
        </button>
      </div>

      <p class="footer-text">Your count, your control.</p>

    </section>
  </main>

  <script src="./counter_script.js"></script>

</body>
</html>
